[package]
name = "frame-dedup"
version = "2.2.0"
edition = "2024"
description = "Remove inserted duplicate frames from H.264 MKVs without re-encoding"
publish = false

[[bin]]
name = "frame-dedup"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
memmap2 = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
xxhash-rust = { version = "0.8.19", features = ["xxh3"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }

# CABAC and motion derivation are far too slow unoptimised.
[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1

# Day-to-day porting builds: optimised, but quick to link.
[profile.fastrel]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
